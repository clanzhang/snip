name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release --disable-sandbox

      - name: Test
        run: swift test -c debug --disable-sandbox

  bump-homebrew:
    name: Bump Homebrew
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: clanzhang/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Calculate SHA256
        id: sha
        run: |
          curl -sL "https://github.com/clanzhang/snip/archive/refs/tags/${{ steps.version.outputs.VERSION }}.tar.gz" -o snip.tar.gz
          echo "SHA256=$(shasum -a 256 snip.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update Formula
        run: |
          cd homebrew-tap
          sed -i '' "s|url \".*\"|url \"https://github.com/clanzhang/snip/archive/refs/tags/${{ steps.version.outputs.VERSION }}.tar.gz\"|" Formula/snip.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${{ steps.sha.outputs.SHA256 }}\"/" Formula/snip.rb
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Formula/snip.rb
          git commit -m "snip: bump to ${{ steps.version.outputs.VERSION }}" || true
          git push